name: Release

# Publishes the geoaeo package (packages/geoaeo).
# Staging channel  = npm dist-tag `next`, on every merge to main (prerelease).
# Production channel = npm dist-tag `latest`, when a vX.Y.Z tag is pushed.
# Both run the same verify before publish.

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  publish:
    runs-on: ubicloud-standard-4
    defaults:
      run:
        working-directory: packages/geoaeo
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Install (workspace root)
        working-directory: .
        run: bun install --frozen-lockfile

      # Staging only. tsup inlines VERSION from package.json into dist/
      # (src/constants.ts imports that file). The prerelease suffix has to be
      # in the repo manifest before Verify, or --version keeps the base version.
      #
      # npm version, run under this repo, also tries to refresh every workspace
      # and dies on the workspace: protocol (EUNSUPPORTEDPROTOCOL).
      # --no-workspaces-update writes this package's version and skips that
      # refresh. Publish still runs from a copy outside the repo, below, for
      # the same protocol reason.
      #
      # Production tags already carry the release version in the pushed commit.
      - name: Set the prerelease version (staging)
        if: github.ref == 'refs/heads/main'
        working-directory: packages/geoaeo
        run: |
          BASE=$(node -p "require('./package.json').version")
          npm version "${BASE}-next.${GITHUB_RUN_NUMBER}" --no-git-tag-version --no-workspaces-update

      - name: Verify
        working-directory: .
        run: bun run --filter geoaeo verify

      # The repo test compares --version against package.json, but it can only
      # ever see a dist/ built from the manifest beside it, so it cannot fail on
      # the ordering this step guards. Assert the real artifact here, after the
      # real build, in the one place the two can diverge.
      - name: The built binary reports the version being published
        working-directory: packages/geoaeo
        run: |
          MANIFEST=$(node -p "require('./package.json').version")
          BUILT=$(node dist/cli.js --version)
          echo "manifest=$MANIFEST built=$BUILT"
          test "$MANIFEST" = "$BUILT"

      # Both publish steps run from a copy of the package OUTSIDE the repo.
      #
      # npm has no workspace: protocol. Run it anywhere under this repo root
      # and it loads the root `workspaces` config, reads every member manifest
      # -- including apps/website, which bun links with workspace:* -- and dies
      # with EUNSUPPORTEDPROTOCOL before it uploads anything. packages/geoaeo
      # itself has no workspace: dependency; being a member of the workspace is
      # enough. A copy with no workspace root above it never enters that mode.
      #
      # --ignore-scripts skips prepublishOnly, which would re-run verify against
      # a tree with no node_modules. The Verify step above already ran it, and
      # it built the dist/ that gets copied here.
      - name: Stage the package outside the workspace
        working-directory: .
        run: |
          rm -rf "$RUNNER_TEMP/geoaeo-publish"
          mkdir -p "$RUNNER_TEMP/geoaeo-publish"
          cp -R packages/geoaeo/. "$RUNNER_TEMP/geoaeo-publish"/
          rm -rf "$RUNNER_TEMP/geoaeo-publish/node_modules"
          test -f "$RUNNER_TEMP/geoaeo-publish/dist/cli.js"

      # Production: a pushed vX.Y.Z tag. package.json version must match the tag.
      - name: Publish latest (production)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ runner.temp }}/geoaeo-publish
        run: npm publish --tag latest --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Staging: a merge to main. The prerelease version is already in
      # package.json, and Verify compiled that same version into dist/.
      - name: Publish next (staging)
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ runner.temp }}/geoaeo-publish
        run: npm publish --tag next --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
