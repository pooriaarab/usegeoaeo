name: Release

# Publishes the geoaeo package (packages/geoaeo).
# Staging channel  = npm dist-tag `next`, on every merge to main (prerelease).
# Production channel = npm dist-tag `latest`, when a vX.Y.Z tag is pushed.
# Both run the same verify before publish.

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/geoaeo
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Install (workspace root)
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Verify
        working-directory: .
        run: bun run --filter geoaeo verify

      # Production: a pushed vX.Y.Z tag. package.json version must match the tag.
      - name: Publish latest (production)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Staging: a merge to main. Publish a unique prerelease under `next`.
      - name: Publish next (staging)
        if: github.ref == 'refs/heads/main'
        run: |
          BASE=$(node -p "require('./package.json').version")
          npm version "${BASE}-next.${GITHUB_RUN_NUMBER}" --no-git-tag-version
          npm publish --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
