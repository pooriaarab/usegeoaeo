name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Shared turbo remote cache. Turbo already skips a task whose inputs have not
# changed; without a remote cache the only place it can look the previous result
# up is the local .turbo directory, which a fresh cloud runner never has.
#
# TURBO_API and TURBO_TEAM are repository variables, not secrets. A worker URL
# and a team name are not sensitive, and keeping them visible means a
# misconfigured cache shows up in the logs rather than silently falling back to
# local-only.
env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  verify:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      # The CLI smoke test below runs the built entrypoint under node, which nothing else
      # in this job provides.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:plugin-skill
      - name: geoaeo CLI smoke test
        run: |
          node packages/geoaeo/dist/cli.js --version
          node packages/geoaeo/dist/cli.js --help
