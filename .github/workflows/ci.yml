name: CI

on:
  push:
    branches: [main, monorepo]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: geoaeo CLI smoke test
        run: |
          node packages/geoaeo/dist/cli.js --version
          node packages/geoaeo/dist/cli.js --help
