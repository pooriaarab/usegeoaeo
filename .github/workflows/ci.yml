name: CI

on:
  push:
    branches: [main, world-class]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - name: CLI smoke test
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
